controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true # 使用仿真时间
    
    # 定义控制器列表

    # 关节状态广播器,发布机器人关节状态信息到/joint_states话题,供其他节点订阅使用
    fishbot_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    # 力矩控制器,通过/fishbot_effort_controller/commands话题接收力矩指令,控制机器人关节的输出力矩
    fishbot_effort_controller:
      type: effort_controllers/JointGroupEffortController
    # 两轮差速控制器,通过/cmd_vel话题接收速度指令,控制机器人运动
    fishbot_diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

# 配置力矩控制器
fishbot_effort_controller:
  ros__parameters: #ros配置参数
    joints: #关节接口(和wheel.urdf.xacro一致)
      - left_wheel_joint #左轮关节
      - right_wheel_joint #右轮关节
    command_interfaces: #力控接口
      - effort #力矩
    state_interfaces: #状态接口
      - position #位置
      - velocity #速度
      - effort #力矩

# 配置两轮差速控制器
fishbot_diff_drive_controller:
  ros__parameters: #ros配置参数
    left_wheel_names: ["left_wheel_joint"] #左轮:关节名字
    right_wheel_names: ["right_wheel_joint"] #右轮:关节名字

    wheel_separation: 0.20 #轮距(与控制器插件一致)
    #wheels_per_side: 1  # actually 2, but both are controlled by 1 signal  #每侧的轮子数量
    wheel_radius: 0.032 #轮半径

    # 校准里程计参数,根据实际运动情况调整这些参数以修正运动误差
    wheel_separation_multiplier: 1.0 #轮距乘数
    left_wheel_radius_multiplier: 1.0 #左轮半径乘数
    right_wheel_radius_multiplier: 1.0 #右轮半径乘数

    publish_rate: 50.0 #里程计数据的发布频率（Hz）
    odom_frame_id: odom #里程计坐标系
    base_frame_id: base_footprint #机器人底盘坐标系
    pose_covariance_diagonal : [0.001, 0.001, 0.0, 0.0, 0.0, 0.01] #里程计位姿的协方差
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01] #里程计速度的协方差

    open_loop: true #控制模式:true=开环控制/false=闭环控制
    enable_odom_tf: true #是否发布里程计TF变换

    cmd_vel_timeout: 0.5 #命令超时时间(秒),如果在这个时间内没有收到新的速度指令(/cmd_vel),控制器将停止机器人运动
    #publish_limited_velocity: true  #是否发布被限速后的实际速度
    use_stamped_vel: false #是否使用带时间戳的速度消息,如果为true,控制器将使用消息中的时间戳来计算速度(/cmd_vel_stamped),否则将使用当前时间(/cmd_vel)
    #velocity_rolling_window_size: 10  #速度平滑的滑动窗口大小


# ros2 control list_controller_types 查看控制器类型列表
# ros2 control load_controller fishbot_joint_state_broadcaster --set-state active 加载并激活fishbot_joint_state_broadcaster控制器
# ros2 control list_controllers 查看已加载控制器列表及其类型状态
# ros2 control set_controller_state fishbot_joint_state_broadcaster inactive 将fishbot_joint_state_broadcaster控制器设置为未激活状态
# ros2 control unload_controller fishbot_joint_state_broadcaster 卸载fishbot_joint_state_broadcaster控制器

# ros2 topic list -t | grep effort
# 给左右轮一个微小的力,控制机器人运动
# ros2 topic pub /fishbot_effort_controller/commands std_msgs/msg/Float64MultiArray "{data: [0.0001, 0.0001]}"
# 查看可用的硬件接口(避免指令冲突不能同时有多个调用者,claimed已占用)
# ros2 control list_hardware_interfaces
