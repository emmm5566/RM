#占据栅格地图
image: room.pgm #地图类型pgm
mode: trinary #地图模式,trinary表示地图中有三种状态:占用/空闲/未知
resolution: 0.05 #地图分辨率(米/像素)
origin: [-10.4, -6.53, 0] #地图原点(米),格式为[x,y,theta],theta地图的旋转角度(弧度)
negate: 0 #地图反转,0表示不反转,1表示反转
occupied_thresh: 0.65 #占用阈值,地图中像素值大于等于该值的区域被认为是占用的
free_thresh: 0.25 #空闲阈值,地图中像素值小于等于该值的区域被认为是空闲的